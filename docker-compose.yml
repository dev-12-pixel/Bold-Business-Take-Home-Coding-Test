services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techforce_owner
      POSTGRES_PASSWORD: owner_pw
      POSTGRES_DB: techforce
      APP_DB_PASSWORD: app_pw
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techforce_owner -d techforce"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_OWNER_USER: techforce_owner
      DB_OWNER_PASSWORD: owner_pw
      DB_APP_USER: techforce_app
      DB_APP_PASSWORD: app_pw
      TECHFORCE_DB: techforce
      RECRUITERS_CSV: /data/recruiters.csv
    volumes:
      - ./backend:/app
      - ./candidates_import.csv:/data/candidates_import.csv:ro
      - ./recruiters.csv:/data/recruiters.csv:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]

volumes:
  pgdata:
  web_node_modules:
